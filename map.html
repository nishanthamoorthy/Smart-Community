<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issue Map — Smart Community</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .map-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 900px) {
      .map-layout { grid-template-columns: 1fr; }
    }

    #main-map {
      height: 620px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .issue-list-item {
      padding: 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.8rem;
    }

    .issue-list-item:hover {
      background: var(--bg-3);
      border-color: rgba(255,255,255,0.15);
    }

    .issue-list-item.urgent {
      border-left: 3px solid var(--danger);
    }

    .legend {
      padding: 0.75rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.8rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .legend-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="/" class="navbar-brand">
    <div class="logo-icon">🌍</div>
    <span class="brand-text">SmartCommunity</span>
  </a>
  <ul class="navbar-nav">
    <li><a href="/">Home</a></li>
    <li><a href="/dashboard">Dashboard</a></li>
    <li><a href="/add_issue">Report Issue</a></li>
    <li><a href="/map" class="active">Map</a></li>
    <li><a href="/volunteer">Volunteer</a></li>
  </ul>
</nav>

<div class="container page-content">
  <div class="page-header">
    <h1 class="page-title">🗺️ Community Issue Map</h1>
    <p class="page-subtitle">All reported issues plotted in real-time. Red markers = urgent, orange = normal.</p>
  </div>

  <div class="map-layout">
    <!-- Sidebar -->
    <div>
      <!-- Filters -->
      <div class="card" style="margin-bottom:1rem;">
        <div class="card-title" style="margin-bottom:1rem;">🔍 Filter Issues</div>
        <div class="form-group">
          <select class="form-control" id="map-filter-severity">
            <option value="">All Severity</option>
            <option value="high">🔴 High</option>
            <option value="medium">🟡 Medium</option>
            <option value="low">🟢 Low</option>
          </select>
        </div>
        <div class="form-group">
          <select class="form-control" id="map-filter-priority">
            <option value="">All Priority</option>
            <option value="high">🚨 Urgent Only</option>
            <option value="normal">✓ Normal Only</option>
          </select>
        </div>
        <button class="btn btn-secondary btn-full btn-sm" onclick="loadMapIssues()">
          ↻ Refresh Map
        </button>
      </div>

      <!-- Legend -->
      <div class="legend" style="margin-bottom:1rem;">
        <div style="font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);margin-bottom:8px;">Legend</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f43f5e"></div> Urgent / High Priority</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div> High Severity</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div> Medium Severity</div>
        <div class="legend-item"><div class="legend-dot" style="background:#38bdf8"></div> Low Severity</div>
      </div>

      <!-- Issue sidebar list -->
      <div class="card" style="max-height:340px;overflow-y:auto;">
        <div class="card-title" style="margin-bottom:0.75rem;">Issues <span id="issue-count" style="color:var(--text-muted);font-size:0.8rem;"></span></div>
        <div id="map-issue-list">
          <div class="loading-overlay"><div class="spinner"></div></div>
        </div>
      </div>
    </div>

    <!-- Map -->
    <div id="main-map"></div>
  </div>
</div>

<script src="/static/js/main.js"></script>
<script>
  // ============================================================
  // Initialize Leaflet map centered on Tamil Nadu
  // ============================================================
  const map = L.map('main-map').setView([11.3410, 77.7172], 9);

  // Dark-ish tile layer (Carto dark matter — free, no API key)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap, © CartoDB',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  let markersLayer = L.layerGroup().addTo(map);


  // ============================================================
  // Create custom circular marker
  // ============================================================
  function createMarker(color, size = 16, pulse = false) {
    const pulseStyle = pulse
      ? `animation: markerPulse 1.5s infinite;`
      : '';

    return L.divIcon({
      className: '',
      html: `
        <div style="position:relative;width:${size}px;height:${size}px;">
          ${pulse ? `<div style="position:absolute;inset:-6px;border-radius:50%;background:${color}22;
            animation:markerPulse 1.5s infinite;"></div>` : ''}
          <div style="width:${size}px;height:${size}px;background:${color};border-radius:50%;
            border:2px solid rgba(255,255,255,0.5);box-shadow:0 2px 8px rgba(0,0,0,0.4);
            position:relative;z-index:1;"></div>
        </div>
      `,
      iconSize: [size, size],
      iconAnchor: [size/2, size/2]
    });
  }

  // Add pulse animation style
  const style = document.createElement('style');
  style.textContent = `@keyframes markerPulse {
    0%,100%{transform:scale(1);opacity:0.7} 50%{transform:scale(1.8);opacity:0} }`;
  document.head.appendChild(style);


  // ============================================================
  // Load and render issues on map
  // ============================================================
  async function loadMapIssues() {
    const severity = document.getElementById('map-filter-severity').value;
    const priority = document.getElementById('map-filter-priority').value;
    const filters = {};
    if (severity) filters.severity = severity;
    if (priority) filters.priority = priority;

    const { data: issues, ok } = await API.getIssues(filters);
    if (!ok) { showToast('Failed to load issues', 'error'); return; }

    markersLayer.clearLayers();

    const colorMap = {
      urgent: '#f43f5e',
      high: '#f97316',
      medium: '#f59e0b',
      low: '#38bdf8'
    };

    // Render markers
    issues.forEach(issue => {
      const isUrgent = issue.priority === 'high';
      const color = isUrgent ? colorMap.urgent
        : issue.severity === 'high' ? colorMap.high
        : issue.severity === 'medium' ? colorMap.medium
        : colorMap.low;

      const marker = L.marker(
        [parseFloat(issue.latitude), parseFloat(issue.longitude)],
        { icon: createMarker(color, isUrgent ? 20 : 14, isUrgent) }
      );

      // Popup content
      const popup = `
        <div style="font-family:'DM Sans',sans-serif;min-width:220px;">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
            <span style="font-size:1rem;">${categoryIcon(issue.category)}</span>
            <strong style="font-size:0.95rem;color:#e8ecf0;">${issue.title}</strong>
          </div>
          ${isUrgent ? `<div style="background:#f43f5e22;color:#f43f5e;padding:4px 10px;border-radius:100px;
            font-size:0.7rem;font-weight:700;letter-spacing:0.08em;display:inline-block;margin-bottom:8px;">🚨 URGENT</div>` : ''}
          <p style="font-size:0.8rem;color:#8b9ab0;margin-bottom:8px;line-height:1.5;">
            ${issue.description || 'No description.'}
          </p>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:0.75rem;color:#8b9ab0;">
            <div>📍 ${issue.location}</div>
            <div>👥 ${issue.people_affected} affected</div>
            <div>⚡ ${issue.severity} severity</div>
            <div>📋 ${issue.category}</div>
          </div>
        </div>
      `;

      marker.bindPopup(popup, { maxWidth: 280 });
      markersLayer.addLayer(marker);
    });

    // Update sidebar list
    document.getElementById('issue-count').textContent = `(${issues.length})`;
    const listEl = document.getElementById('map-issue-list');

    if (!issues.length) {
      listEl.innerHTML = '<div class="empty-state" style="padding:1rem"><p>No issues match filters</p></div>';
      return;
    }

    listEl.innerHTML = issues.map((issue, i) => `
      <div class="issue-list-item ${issue.priority === 'high' ? 'urgent' : ''}"
           onclick="flyToIssue(${issue.latitude}, ${issue.longitude})">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
          <span>${categoryIcon(issue.category)}</span>
          <span style="font-weight:600;color:var(--text);font-size:0.85rem;">${issue.title}</span>
        </div>
        <div style="color:var(--text-dim);">📍 ${issue.location} · 👥 ${issue.people_affected}</div>
        <div style="margin-top:4px;">${severityBadge(issue.severity)} ${priorityBadge(issue.priority)}</div>
      </div>
    `).join('');

    // Fit map to markers if we have issues
    if (issues.length > 0) {
      const bounds = issues.map(i => [parseFloat(i.latitude), parseFloat(i.longitude)]);
      map.fitBounds(bounds, { padding: [40, 40] });
    }
  }

  function flyToIssue(lat, lon) {
    map.flyTo([lat, lon], 13, { duration: 1.2 });
  }

  // Filter change listeners
  document.getElementById('map-filter-severity').addEventListener('change', loadMapIssues);
  document.getElementById('map-filter-priority').addEventListener('change', loadMapIssues);

  // Init
  loadMapIssues();
</script>
</body>
</html>
