<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteer — Smart Community</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="/" class="navbar-brand">
    <div class="logo-icon">🌍</div>
    <span class="brand-text">SmartCommunity</span>
  </a>
  <ul class="navbar-nav">
    <li><a href="/">Home</a></li>
    <li><a href="/dashboard">Dashboard</a></li>
    <li><a href="/add_issue">Report Issue</a></li>
    <li><a href="/map">Map</a></li>
    <li><a href="/volunteer" class="active">Volunteer</a></li>
  </ul>
</nav>

<div class="container page-content">
  <!-- Not logged in: show auth forms -->
  <div id="auth-section">
    <div class="page-header">
      <h1 class="page-title">Volunteer Portal</h1>
      <p class="page-subtitle">Register your skills and help your community</p>
    </div>

    <div style="max-width:520px;margin:0 auto;">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login Form -->
      <div class="tab-content active" id="tab-login">
        <div class="card">
          <div id="login-alert"></div>
          <form id="login-form">
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" id="login-email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="login-btn">
              Sign In
            </button>
          </form>
          <div style="margin-top:1rem;text-align:center;font-size:0.85rem;color:var(--text-muted)">
            No account?
            <a href="#" onclick="switchTab('register')" style="color:var(--accent);font-weight:600;">Register here</a>
          </div>

          <!-- Demo credentials hint -->
          <div style="margin-top:1rem;padding:10px;background:var(--bg-3);border-radius:10px;font-size:0.8rem;color:var(--text-dim);">
             <code style="color:var(--accent-2)"></code><code style="color:var(--accent-2)"></code>
          </div>
        </div>
      </div>

      <!-- Register Form -->
      <div class="tab-content" id="tab-register">
        <div class="card">
          <div id="register-alert"></div>
          <form id="register-form">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Full Name *</label>
                <input type="text" class="form-control" id="reg-name" placeholder="Your name" required>
              </div>
              <div class="form-group">
                <label class="form-label">Phone</label>
                <input type="tel" class="form-control" id="reg-phone" placeholder="9876543210">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Email *</label>
              <input type="email" class="form-control" id="reg-email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
              <label class="form-label">Password *</label>
              <input type="password" class="form-control" id="reg-password" placeholder="Min 6 characters" minlength="6" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Your Skill *</label>
                <select class="form-control" id="reg-skill" required>
                  <option value="">Select skill</option>
                  <option value="doctor">Doctor</option>
                  <option value="nurse">Nurse</option>
                  <option value="teacher"> Teacher</option>
                  <option value="driver">Driver</option>
                  <option value="engineer"> Engineer</option>
                  <option value="counselor"> Counselor</option>
                  <option value="general">General Helper</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Your Location *</label>
                <input type="text" class="form-control" id="reg-location" placeholder="e.g. Erode" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="register-btn">
              Register as Volunteer
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Logged-in: show dashboard -->
  <div id="volunteer-dashboard" class="hidden">
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem;">
      <div>
        <h1 class="page-title" id="welcome-name">Welcome back!</h1>
        <p class="page-subtitle" id="welcome-info">Your volunteer profile</p>
      </div>
      <button class="btn btn-secondary" onclick="doLogout()">Sign Out</button>
    </div>

    <!-- Volunteer Stats -->
    <div class="stats-grid" style="margin-bottom:2rem;">
      <div class="stat-card orange">
        <div class="stat-icon"></div>
        <div class="stat-value" id="v-total-tasks">—</div>
        <div class="stat-label">Assigned Tasks</div>
      </div>
      <div class="stat-card red">
        <div class="stat-icon">🚨</div>
        <div class="stat-value" id="v-urgent-tasks">—</div>
        <div class="stat-label">Urgent Tasks</div>
      </div>
      <div class="stat-card green">
        <div class="stat-icon">✅</div>
        <div class="stat-value" id="v-completed">—</div>
        <div class="stat-label">Completed</div>
      </div>
    </div>

    <!-- Task list -->
    <div class="card">
      <div class="card-header">
        <span class="card-title"> My Assigned Tasks</span>
        <button class="btn btn-secondary btn-sm" onclick="loadMyTasks()">↻ Refresh</button>
      </div>
      <div id="task-list">
        <div class="loading-overlay"><div class="spinner"></div> Loading tasks...</div>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/main.js"></script>
<script>
  // Check if already logged in (via localStorage simple state)
  let currentVolunteer = JSON.parse(localStorage.getItem('volunteer') || 'null');

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
    });
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  }

  function showVolunteerDashboard(volunteer) {
    currentVolunteer = volunteer;
    localStorage.setItem('volunteer', JSON.stringify(volunteer));
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('volunteer-dashboard').classList.remove('hidden');
    document.getElementById('welcome-name').textContent = `👋 Welcome, ${volunteer.name}!`;
    document.getElementById('welcome-info').textContent =
      `${skillIcon(volunteer.skill)} ${volunteer.skill} · 📍 ${volunteer.location}`;
    loadMyTasks();
  }

  async function loadMyTasks() {
    if (!currentVolunteer) return;
    const { data: tasks, ok } = await API.myTasks(currentVolunteer.id);
    const el = document.getElementById('task-list');

    if (!ok) { el.innerHTML = '<div class="alert alert-error">Failed to load tasks</div>'; return; }

    // Update stats
    document.getElementById('v-total-tasks').textContent = tasks.length;
    document.getElementById('v-urgent-tasks').textContent = tasks.filter(t => t.priority === 'high').length;
    document.getElementById('v-completed').textContent = tasks.filter(t => t.assignment_status === 'completed').length;

    if (!tasks.length) {
      el.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <h3>No tasks yet</h3>
          <p>You haven't been assigned to any issues yet.<br>An NGO admin will assign you based on skill & location match.</p>
        </div>
      `;
      return;
    }

    el.innerHTML = tasks.map(task => `
      <div class="issue-card ${task.priority === 'high' ? 'priority-high' : ''}" style="margin-bottom:0.75rem;cursor:default;">
        <div class="issue-meta">
          ${categoryIcon(task.category)}
          ${severityBadge(task.severity)}
          ${priorityBadge(task.priority)}
          ${statusBadge(task.issue_status)}
        </div>
        <div class="issue-title">${task.title}</div>
        <p class="issue-desc">${task.description || 'No description provided.'}</p>
        <div class="issue-footer">
          <span>📍 ${task.location}</span>
          <span> ${task.people_affected} affected</span>
          <span> ${formatDate(task.assigned_at)}</span>
        </div>
      </div>
    `).join('');
  }

  async function doLogout() {
    await API.logout();
    localStorage.removeItem('volunteer');
    currentVolunteer = null;
    document.getElementById('auth-section').classList.remove('hidden');
    document.getElementById('volunteer-dashboard').classList.add('hidden');
    showToast('Logged out successfully', 'info');
  }

  // ============================================================
  // Login form
  // ============================================================
  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in...';

    const { data, ok } = await API.loginVolunteer({
      email: document.getElementById('login-email').value,
      password: document.getElementById('login-password').value
    });

    btn.disabled = false;
    btn.textContent = 'Sign In';

    if (!ok) {
      document.getElementById('login-alert').innerHTML =
        `<div class="alert alert-error">✕ ${data?.error || 'Login failed'}</div>`;
      return;
    }

    showToast(`Welcome back, ${data.name}!`, 'success');
    showVolunteerDashboard(data);
  });

  // ============================================================
  // Register form
  // ============================================================
  document.getElementById('register-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('register-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Registering...';

    const { data, ok } = await API.registerVolunteer({
      name: document.getElementById('reg-name').value.trim(),
      email: document.getElementById('reg-email').value.trim(),
      password: document.getElementById('reg-password').value,
      skill: document.getElementById('reg-skill').value,
      location: document.getElementById('reg-location').value.trim(),
      phone: document.getElementById('reg-phone').value.trim()
    });

    btn.disabled = false;
    btn.textContent = 'Register as Volunteer';

    if (!ok) {
      document.getElementById('register-alert').innerHTML =
        `<div class="alert alert-error">✕ ${data?.error || 'Registration failed'}</div>`;
      return;
    }

    showToast('Registration successful! Welcome!', 'success');
    showVolunteerDashboard(data);
  });

  // Auto-restore session on page load
  if (currentVolunteer) {
    showVolunteerDashboard(currentVolunteer);
  }
</script>
</body>
</html>
